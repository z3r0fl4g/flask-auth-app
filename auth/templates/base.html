<!DOCTYPE html>
<html>

<head>
  <title>JM Media</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              light: '#f43f5e', // rose-500
              DEFAULT: '#e11d48', // rose-600
              dark: '#be123c', // rose-700
            },
            accent: '#ec4899', // pink-500
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['"Space Grotesk"', 'monospace'],
          },
        }
      }
    }
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      line-height: 1.2;
    }
  </style>
</head>

<body class="bg-gray-50 overflow-y-scroll">
  {% include 'nav.html' %}

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
  </main>

  {% include 'footer.html' %}

  <!-- Alpine.js for dropdowns -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Toggle password visibility
    function togglePassword() {
      const passwordField = document.getElementById('passwordField');
      const confirmField = document.getElementById('confirmPasswordField');
      const eyeIcon = event.currentTarget.querySelector('[data-lucide]');
      if (passwordField && eyeIcon) {
        if (passwordField.type === 'password') {
          passwordField.type = 'text';
          if (confirmField) confirmField.type = 'text';
          eyeIcon.setAttribute('data-lucide', 'eye-off');
        } else {
          passwordField.type = 'password';
          if (confirmField) confirmField.type = 'password';
          eyeIcon.setAttribute('data-lucide', 'eye');
        }
        lucide.createIcons();
      }
    }

    // Mobile menu toggle
    document.addEventListener('DOMContentLoaded', function () {
      const mobileMenuButton = document.getElementById('mobile-menu-button');
      const mobileMenu = document.getElementById('mobile-menu');

      if (mobileMenuButton && mobileMenu) {
        mobileMenuButton.addEventListener('click', function () {
          mobileMenu.classList.toggle('hidden');
        });
      }
    });
  </script>
</body>

</html>
