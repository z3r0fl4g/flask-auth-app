<!DOCTYPE html>
<html>

<head>
  <title>Tikepam | Real Haitian Events &amp; Fast Tickets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              light: '#f43f5e', // rose-500
              DEFAULT: '#e11d48', // rose-600
              dark: '#be123c', // rose-700
            },
            accent: '#ec4899', // pink-500
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['"Space Grotesk"', 'monospace'],
          },
        }
      }
    }
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --brand-amber: #ffbe0b;
      --brand-rose: #ff006e;
      --brand-orange: #fb5607;
    }

    body {
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      line-height: 1.2;
    }

    /* Primary button per ui_design.md (Section: Buttons) */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border-radius: 9999px;
      background-image: linear-gradient(to right, #8338ec, #6414d5);
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      font-size: 0.875rem;
      line-height: 1.5;
      box-shadow: 0 4px 6px -1px rgba(131, 56, 236, 0.25), 0 2px 4px -2px rgba(131, 56, 236, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(131, 56, 236, 0.35), 0 4px 6px -4px rgba(131, 56, 236, 0.35);
    }

    .btn-primary:disabled,
    .btn-primary[aria-disabled="true"] {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: 0 4px 6px -1px rgba(131, 56, 236, 0.15), 0 2px 4px -2px rgba(131, 56, 236, 0.15);
    }

    /* Outline variant per ui_design.md (Section: Buttons) */
    .btn-outline-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border-radius: 9999px;
      border: 1px solid #8338ec;
      background-color: #ffffff;
      color: #8338ec;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      font-size: 0.875rem;
      line-height: 1.5;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-outline-primary:hover {
      background-color: rgba(131, 56, 236, 0.10);
      transform: translateY(-2px);
    }

    /* Icon alignment helper (optional) */
    .btn-primary i,
    .btn-outline-primary i {
      font-style: normal;
    }

    .btn-primary:focus-visible,
    .btn-outline-primary:focus-visible {
      outline: 2px solid rgba(131, 56, 236, 0.4);
      outline-offset: 2px;
    }

    /* Ambient glows pinned to the viewport background */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: -10;
      pointer-events: none;
      overflow: hidden;
    }

    .glow {
      position: absolute;
      border-radius: 9999px;
      filter: blur(120px);
      opacity: 0.28;
    }

    .glow--rose {
      background: radial-gradient(circle at 50% 50%, rgba(255, 0, 110, 0.42) 0%, rgba(255, 0, 110, 0) 60%);
    }

    .glow--amber {
      background: radial-gradient(circle at 50% 50%, rgba(255, 190, 11, 0.42) 0%, rgba(255, 190, 11, 0) 60%);
    }

    .glow--orange {
      background: radial-gradient(circle at 50% 50%, rgba(251, 86, 7, 0.38) 0%, rgba(251, 86, 7, 0) 60%);
    }

    @media (max-width: 640px) {
      .glow {
        filter: blur(90px);
        opacity: 0.24;
      }
    }
  </style>
</head>

<body class="min-h-screen bg-[#f8f9ff] text-gray-900 overflow-x-hidden flex flex-col">
  <div class="ambient-bg">
    <div class="glow glow--rose" style="width:42rem;height:42rem;top:-14rem;right:-18rem;"></div>
    <div class="glow glow--amber" style="width:38rem;height:38rem;bottom:-16rem;left:-12rem;"></div>
    <div class="glow glow--orange" style="width:30rem;height:30rem;top:40%;left:48%;transform:translateX(-48%);"></div>
  </div>
  {% include 'nav.html' %}

  <!-- Structured flex layout so footer anchors bottom per ui_design.md (Section: Navigation & Footer) -->
  <main class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-1 w-full">
    {% block content %}{% endblock %}
  </main>

  {% include 'footer.html' %}

  <!-- Alpine.js for dropdowns -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Toggle password visibility
    function togglePassword(evt) {
      const button = evt.currentTarget;
      const targetId = button.getAttribute('data-target') || 'passwordField';
      const passwordField = document.getElementById(targetId);
      const confirmField = document.getElementById('confirmPasswordField');
      const eyeIcon = button.querySelector('[data-lucide]');
      if (!passwordField || !eyeIcon) return;
      const showing = passwordField.type === 'text';
      const newType = showing ? 'password' : 'text';
      passwordField.type = newType;
      if (confirmField && (!button.hasAttribute('data-target') || button.getAttribute('data-target') === 'passwordField')) {
        confirmField.type = newType;
      }
      eyeIcon.setAttribute('data-lucide', showing ? 'eye' : 'eye-off');
      button.setAttribute('aria-pressed', showing ? 'false' : 'true');
      button.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      lucide.createIcons();
    }

    // Mobile menu toggle
    document.addEventListener('DOMContentLoaded', function () {
      const mobileMenuButton = document.getElementById('mobile-menu-button');
      const mobileMenu = document.getElementById('mobile-menu');

      if (mobileMenuButton && mobileMenu) {
        mobileMenuButton.addEventListener('click', function () {
          mobileMenu.classList.toggle('hidden');
        });
      }
    });
  </script>
</body>

</html>
